<!-- Duration Slider in index.html -->
<div>
  <div class="flex justify-between text-sm font-medium mb-1">
    <label>Clip Duration (Minutes)</label>
    <span id="durationVal" class="text-blue-400 font-bold">5 min</span>
  </div>
  <!-- Min: 1 min (60s), Max: 10 min (600s), Step: 1 min (60s) -->
  <input 
    type="range" 
    id="duration" 
    min="1" 
    max="10" 
    value="5" 
    class="w-full accent-blue-500 cursor-pointer" 
    oninput="document.getElementById('durationVal').textContent = this.value + ' min'"
  >
</div>
